name: Build IOTrackerOnWeb

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: Build IOTracker iOS Tweak
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos

      - name: Install Theos dependencies
        run: |
          brew install libxml2 dpkg ldid

      - name: Build CocoaHTTPServer
        run: |
          cd CocoaHTTPServer
          make headers
          make
          cd ..

      - name: Build Theos Tweak
        run: |
          export THEOS=$HOME/theos
          ln -sf $THEOS theos
          make clean
          make
          mkdir -p debs
          cp .theos/obj/debug/IOTracker.dylib debs/
          # Create minimal deb package
          mkdir -p debs_root/DEBIAN debs_root/Library/Developer/Cydia/Substrate/TweakLoading/iOS
          cp debs/IOTracker.dylib debs_root/Library/Developer/Cydia/Substrate/TweakLoading/iOS/
          echo "Package: com.ioTracker.tweak
Version: 1.0.0
Architecture: iphoneos-arm
Description: IO Tracker iOS Tweak" > debs_root/DEBIAN/control
          dpkg-deb --build debs_root debs/IOTracker.deb
          ls -la debs/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IOTracker-deb
          path: debs/*.deb
