name: Build IOTrackerOnWeb

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: Build IOTracker iOS Tweak
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos

      - name: Install Theos dependencies
        run: |
          brew install libxml2 dpkg ldid

      - name: Build CocoaHTTPServer
        run: |
          cd CocoaHTTPServer
          make headers
          make
          cd ..

      - name: Build Theos Tweak
        run: |
          export THEOS=$HOME/theos
          ln -sf $THEOS theos
          make clean
          make
          # Create deb manually since Theos package target has issues with newer versions
          dpkg-deb --build TheosPackage TheosPackage.deb 2>/dev/null || \
          mkdir -p TheosPackage/DEBIAN TheosPackage/Library/Developer/Cydia/Substrate/TweakLoading/iOS/IOTracker.dylib && \
          cp .theos/obj/debug/IOTracker.dylib TheosPackage/Library/Developer/Cydia/Substrate/TweakLoading/iOS/ && \
          dpkg-deb --build TheosPackage debs/ 2>/dev/null || true
          ls -la .theos/obj/debug/*.dylib debs/ 2>/dev/null || ls -la .theos/obj/debug/IOTracker.dylib 2>/dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IOTracker-deb
          path: debs/*.deb
